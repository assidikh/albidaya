const ALPHA='abcdefghilmnoprstuv'.split('');
const sample=(a,n)=>sh(a).slice(0,n);
function tokensOf(w){return w.indexOf(' ')>=0?w.split(' '):[...w]}
function canBuild(w){return tokensOf(w).length<=9}
function genQs(u,n=10){
 const P=u.items,qs=[];let bag=[];
 const okT=(t,it)=>t==='L2W'?P.length>=4:t==='W2S'?new Set(P.map(x=>x.s)).size>=3:t==='EMO'?!!it.e&&P.length>=4:t==='BUILD'?canBuild(it.w):t==='WORD'?!!it.ex:false;
 for(let i=0;i<n;i++){
  if(!bag.length)bag=sh(P);const it=bag.pop();
  const ts=u.types.filter(t=>okT(t,it));const t=pick(qs.length&&ts.length>1?ts.filter(x=>x!==qs[qs.length-1].t):ts);
  const oth=P.filter(x=>x.w!==it.w);
  if(t==='L2W')qs.push({t,say:it.s,ans:it.w,opts:sh([it.w,...sample(oth,3).map(x=>x.w)])});
  else if(t==='EMO')qs.push({t,e:it.e,say:it.s,ans:it.w,opts:sh([it.w,...sample(oth,3).map(x=>x.w)])});
  else if(t==='W2S'){const d=sample(oth.filter(x=>x.s!==it.s),50),o=[it.s];for(const x of d)if(!o.includes(x.s)&&o.length<3)o.push(x.s);qs.push({t,show:it.w,ans:it.s,opts:sh(o)})}
  else{const w=t==='WORD'?it.ex:it.w,tk=tokensOf(w),sp=w.indexOf(' ')>=0;
   let dis;if(sp){const all=[...new Set(P.flatMap(x=>tokensOf(x.w)))].filter(x=>!tk.includes(x));dis=sample(all,tk.length>3?2:1)}else dis=sample(ALPHA.filter(x=>!tk.includes(x)),tk.length>5?2:2);
   qs.push({t:'BUILD',say:w,e:t==='WORD'?it.e:it.e,ans:w,tk,sp,pool:sh([...tk,...dis].map((x,k)=>({k,t:x})))})}
 }
 return qs}

/* ---- navigation ---- */
function go(s,o={},push=true){V=Object.assign({s},o);if(push)history.pushState({V},'');render();window.scrollTo(0,0)}
window.addEventListener('popstate',e=>{let v=e.state&&e.state.V;if(!v||v.s==='play'||v.s==='res')v={s:'home'};if(G){G=null}V=v;render()});
const bar=(p,c)=>`<div class="bar"><i style="width:${Math.min(100,p*100)}%;background:${c||'var(--acc)'}"></i></div>`;
function head(){const L=lvl(S.xp),a=xpAt(L),b=xpAt(L+1);return`<div class="hd"><div class="av">${(S.name||'?')[0].toUpperCase()}</div><div class="hm"><b>${S.name}</b><small>Niveau ${L}</small>${bar((S.xp-a)/(b-a),'#f59e0b')}</div><div class="fire">🔥<b>${S.streak}</b></div></div>`}
const SIGN=`<div class="sign"><b>Aboubakar</b><small>Barkey Technology · N'Djaména, Tchad</small></div>`;
function nav(){const t=[['home','🗺️','Leçons'],['about','💬','Mon mot'],['profile','👤','Profil']];return`<nav>${t.map(x=>`<button data-a="tab" data-v="${x[0]}" class="${V.s===x[0]?'on':''}"><span>${x[1]}</span>${x[2]}</button>`).join('')}</nav>`}
function render(){const R2={onb:rOnb,home:rHome,unit:rUnit,play:rPlay,res:rRes,about:rAbout,profile:rProfile};$('#app').innerHTML=(R2[V.s]||rHome)();if(V.s==='res')confetti()}
/* ---- écrans ---- */
function rOnb(){return`<div class="onb"><div class="logo">Ab</div><h1>Albidaya</h1><div class="arh">${AR('البداية')}</div><p>Apprends à lire et à écrire le français : <b>écoute, touche, répète</b>.</p><p class="ar2">${AR('تعلّم قراءة الفرنسية وكتابتها: اسمع، المس، كرّر')}</p>
<label>Ton prénom ${AR('اسمك')}</label><input id="nm" maxlength="14" placeholder="Ex : Ahmat" autocomplete="off">
<button class="big" data-a="start">Commencer ${AR('ابدأ')} →</button><button class="link" data-a="test">🔊 Tester le son</button><button class="link" data-a="aboutonb">💬 Pourquoi cette application ?</button></div>`}
function warn(){return noVoice()?`<div class="warn">⚠️ Ce téléphone n'a pas de voix française.<br><small>Va dans Paramètres → Langue → Synthèse vocale (Google) → installe le français.</small><br>${AR('لا يوجد صوت فرنسي في هاتفك. ثبّت اللغة الفرنسية في إعدادات «تحويل النص إلى كلام».')}</div>`:''}
function rHome(){const tot=UNITS.length*3,got=UNITS.reduce((a,u)=>a+stars(u.id),0);
 return`${head()}${warn()}<div class="ct"><h2>Mon parcours</h2><small>⭐ ${got} / ${tot}</small>${bar(got/tot)}</div><div class="path">${UNITS.map((u,i)=>{const ok=unlocked(i),s=stars(u.id);return`<button class="node ${ok?'':'lock'} ${s?'done':''} ${i%2?'r':'l'}" data-a="unit" data-v="${i}"><span class="ic">${ok?u.ic:'🔒'}</span><span class="nt"><b>${u.t}</b><small>${ok?(s?[1,2,3].map(k=>k<=s?'⭐':'☆').join(''):'Nouveau !'):'Termine la leçon d\'avant'}</small></span></button>`}).join('')}</div>${SIGN}${nav()}`}
function hl(ex,w){const i=ex.toLowerCase().indexOf(w);return i<0?ex:ex.slice(0,i)+'<u>'+ex.slice(i,i+w.length)+'</u>'+ex.slice(i+w.length)}
function rUnit(){const u=UNITS[V.i],tabs=u.items;let body='';
 if(u.mode==='cards'){const it=u.items[V.k||0];body=`<div class="card big-card"><div class="dots">${u.items.map((_,j)=>`<i class="${j<=(V.k||0)?'on':''}"></i>`).join('')}</div><div class="glyph">${it.w.length<=2?it.w.toUpperCase()+' '+it.w:it.w}</div><button class="spk" data-a="say" data-v="${it.s}">🔊</button>${it.ex?`<button class="exw" data-a="say" data-v="${it.ex}"><span class="em">${it.e}</span><span>${hl(it.ex,it.w)}</span><span>🔊</span></button>`:''}${it.ar?`<div class="tip">${AR(it.ar)}</div>`:''}</div><div class="row">${(V.k||0)>0?'<button class="sec" data-a="kprev">←</button>':''}<button class="sec" data-a="kn">${(V.k||0)<u.items.length-1?'Suivant →':'Revoir depuis le début'}</button></div>`}
 else body=`<div class="grid g${u.cols}">${u.items.map(it=>`<button class="tile" data-a="say" data-v="${it.s}">${it.e?`<span class="em">${it.e}</span>`:''}<b>${it.w}</b></button>`).join('')}</div>`;
 return`<div class="top"><button class="back" data-a="home">←</button><h2>${u.ic} ${u.t}</h2></div><div class="tip">${AR(u.ar)}</div><p class="hint0">Touche pour écouter. Répète à voix haute !</p>${body}<div class="row"><button class="big" data-a="play">Jouer ${AR('العب')} 🎮</button></div>${nav()}`}
/* ---- jeu ---- */
function begin(i){const u=UNITS[i];G={i,qs:genQs(u,10),n:0,hearts:3,mist:0,st:'ask',sel:-1,built:[],xp:0,good:false};V={s:'play'};history.pushState({V:{s:'play'}},'');render();setTimeout(autoplay,250)}
function autoplay(){if(!G||G.st!=='ask')return;const q=G.qs[G.n];if(q.say)say(q.say)}
const TITLE={L2W:['Écoute et choisis','اسمع واختر'],W2S:['Quel est le bon son ?','ما النطق الصحيح؟'],EMO:['Choisis le mot','اختر الكلمة'],BUILD:['Écoute et écris','اسمع واكتب']};
function rPlay(){const q=G.qs[G.n];if(!q)return'';const fb=G.st==='fb',t=TITLE[q.t];let body='';
 const big=q.t==='L2W'||q.opts&&q.opts.some(o=>o.length>3);
 if(q.t==='L2W'||q.t==='EMO'){body=`<div class="prompt">${q.e?`<div class="bigem">${q.e}</div>`:''}<button class="spk" data-a="say" data-v="${q.say}">🔊</button></div><div class="opts ${q.opts.some(o=>o.length>12)?'one':''}">${q.opts.map((o,i)=>`<button class="opt ${fb?(o===q.ans?'good':(i===G.sel?'bad':'dim')):''}" data-a="opt" data-v="${i}" ${fb?'disabled':''}>${o}</button>`).join('')}</div>`}
 else if(q.t==='W2S'){body=`<div class="prompt"><div class="bigw">${q.show}</div></div><div class="opts one">${q.opts.map((o,i)=>`<button class="opt snd ${i===G.sel?'selc':''} ${fb?(o===q.ans?'good':(i===G.sel?'bad':'dim')):''}" data-a="pick" data-v="${i}" ${fb?'disabled':''}>🔊 <span>${i+1}</span></button>`).join('')}</div>${fb?'':`<div class="row"><button class="big" data-a="ok" ${G.sel<0?'disabled':''}>Valider ✓</button></div>`}`}
 else{body=`<div class="prompt">${q.e?`<div class="bigem">${q.e}</div>`:''}<button class="spk" data-a="say" data-v="${q.say}">🔊</button></div><div class="slot ${fb?(G.good?'sok':'sko'):''}">${G.built.length?G.built.map((k,j)=>`<button class="chip" data-a="unbuild" data-v="${j}" ${fb?'disabled':''}>${q.pool.find(p=>p.k===k).t}</button>`).join(''):'<span class="ph">…</span>'}</div><div class="poolw">${q.pool.map(p=>`<button class="chip ${G.built.includes(p.k)?'used':''}" data-a="build" data-v="${p.k}" ${fb||G.built.includes(p.k)?'disabled':''}>${p.t}</button>`).join('')}</div>${fb?'':`<div class="row"><button class="sec" data-a="clear">⌫</button><button class="big" data-a="ok" ${G.built.length?'':'disabled'}>Valider ✓</button></div>`}`}
 return`<div class="ptop"><button class="back" data-a="quit">✕</button>${bar((G.n+(fb?1:0))/G.qs.length,'#14b8a6')}<div class="hearts">${[0,1,2].map(i=>i<G.hearts?'❤️':'🖤').join('')}</div></div>
 <div class="qh"><b>${t[0]}</b>${AR(t[1])}</div>${body}
 ${fb?`<div class="fb ${G.good?'ok':'ko'}"><b>${G.good?['Bravo ! 🎉','Très bien ! ✨','Parfait ! 💪'][G.n%3]:'Écoute bien…'}</b>${G.good?'':`<div class="corr">${q.t==='W2S'?'🔊':q.ans}</div>`}<div class="row"><button class="sec" data-a="say" data-v="${q.t==='W2S'?q.ans:(q.say||q.ans)}">🔊 Réécouter</button><button class="big" data-a="next">${G.n+1>=G.qs.length||G.hearts<=0?'Terminer':'Continuer'}</button></div></div>`:''}`}
function answer(good){G.st='fb';G.good=good;const q=G.qs[G.n];if(good){G.xp+=10;sOk()}else{G.hearts--;G.mist++;sBad();try{navigator.vibrate&&navigator.vibrate([60,40,60])}catch(e){}}render();setTimeout(()=>say(q.t==='W2S'?q.ans:(q.say||q.ans)),good?150:450)}
function finish(){const fail=G.hearts<=0,m=G.mist,s=fail?0:(m===0?3:m===1?2:1);const bonus=s*20,r={fail,s,xp:fail?Math.floor(G.xp/2):G.xp+bonus,i:G.i};
 if(!fail){S.prog[UNITS[G.i].id]=Math.max(S.prog[UNITS[G.i].id]||0,s);const t=today();if(S.last!==t){S.streak=S.last===yest()?S.streak+1:1;S.last=t}sWin()}
 S.xp+=r.xp;save();V={s:'res',R:r};G=null;history.pushState({V:{s:'res'}},'');render()}
function rRes(){const r=V.R,u=UNITS[r.i],nx=UNITS[r.i+1];return`<div class="res"><div class="big-emoji">${r.fail?'💪':r.s===3?'🏆':'🎉'}</div><h1>${r.fail?'Courage !':r.s===3?'Parfait !':'Bravo !'}</h1>${r.fail?`<p>Écoute encore la leçon, puis recommence.<br>${AR('استمع للدرس مرة أخرى ثم أعد المحاولة')}</p>`:`<div class="stars">${[1,2,3].map(i=>`<span class="${i<=r.s?'on':''}" style="animation-delay:${i*.25}s">⭐</span>`).join('')}</div>`}<div class="xpbox">+${r.xp} XP</div>
 <div class="row col">${!r.fail&&nx?`<button class="big" data-a="unit" data-v="${r.i+1}">Leçon suivante : ${nx.t} →</button>`:''}<button class="${!r.fail&&nx?'sec':'big'}" data-a="${r.fail?'unit':'home'}" data-v="${r.i}">${r.fail?'Réécouter la leçon':'Retour au parcours'}</button>${r.fail?`<button class="sec" data-a="play" data-v="${r.i}">Réessayer</button>`:''}</div></div>`}
const MOT_FR=[`Albidaya veut dire « le commencement » en arabe.`,`Beaucoup de personnes arabophones veulent comprendre le français écrit : suivre un cours sur les réseaux sociaux, lire un livre simple, aider leurs enfants… mais ne savent pas par où commencer.`,`J'ai créé cette application pour elles : une méthode très simple, sans connexion internet une fois installée. On écoute, on touche, on répète. Rien de plus.`,`C'est un premier pas. Le reste viendra avec la pratique. Bon courage !`];
const MOT_AR=[`البداية تطبيق بسيط لكل ناطق بالعربية يريد أن يتعلّم قراءة الفرنسية وكتابتها، ليتابع دورات التواصل الاجتماعي أو يقرأ كتابًا بسيطًا.`,`تسمع، تلمس، تكرّر. هذه خطوتك الأولى، وبالتوفيق!`];
function rAbout(){return`${V.onb?`<div class="top"><button class="back" data-a="back">←</button><h2>Mon mot</h2></div>`:head()}<div class="card mot"><h3>💬 Pourquoi Albidaya ?</h3>${MOT_FR.map(p=>`<p>${p}</p>`).join('')}<div class="motar" dir="rtl" lang="ar">${MOT_AR.map(p=>`<p>${p}</p>`).join('')}</div>${SIGN}</div>${V.onb?'':nav()}`}
function rProfile(){const L=lvl(S.xp);return`${head()}<div class="ct"><h2>👤 Mon profil</h2></div><div class="card"><div class="stat"><b>${S.xp}</b><small>XP</small></div><div class="stat"><b>${S.streak}</b><small>jours de suite</small></div><div class="stat"><b>${UNITS.filter(u=>stars(u.id)).length}/${UNITS.length}</b><small>leçons</small></div></div>
 <div class="card"><label class="tg"><span>🐢 Voix lente</span><input type="checkbox" data-a="slow" ${S.slow?'checked':''}></label><label class="tg"><span>🔓 Tout débloquer</span><input type="checkbox" data-a="unl" ${S.unlock?'checked':''}></label><button class="sec" data-a="test">🔊 Tester le son</button><button class="sec" data-a="rename">Changer de prénom</button><button class="sec danger" data-a="reset">Tout effacer</button><small class="foot">Ta progression reste sur ce téléphone. Le son utilise la voix française de ton téléphone.</small></div>${SIGN}${nav()}`}
function confetti(){const e=['🎉','⭐','✨','🎊'];let h='';for(let i=0;i<22;i++)h+=`<i style="left:${Math.random()*98}%;animation-delay:${(Math.random()*1.2).toFixed(2)}s;animation-duration:${(2+Math.random()*2).toFixed(2)}s">${pick(e)}</i>`;const d=document.createElement('div');d.className='conf';d.innerHTML=h;document.body.appendChild(d);setTimeout(()=>d.remove(),5000)}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
/* ---- clics ---- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
 if(a==='say')return say(v);
 if(a==='test')return say('Bonjour ! Bienvenue sur Albidaya.');
 if(a==='start'){const n=$('#nm').value.trim();if(!n){$('#nm').focus();return}S.name=n;save();history.replaceState({V:{s:'home'}},'');return go('home',{},false)}
 if(a==='aboutonb')return go('about',{onb:1});
 if(a==='back')return history.back();
 if(a==='tab')return go(v,{});
 if(a==='home')return go('home',{});
 if(a==='unit'){const i=+v;if(!unlocked(i))return toast('Termine d\'abord la leçon précédente');return go('unit',{i,k:0})}
 if(a==='kn'){const u=UNITS[V.i];V.k=(V.k||0)<u.items.length-1?(V.k||0)+1:0;render();return say(u.items[V.k].s)}
 if(a==='kprev'){V.k--;render();return say(UNITS[V.i].items[V.k].s)}
 if(a==='play')return begin(v!==undefined?+v:V.i);
 if(a==='quit'){if(confirm('Quitter la leçon ?')){G=null;history.back()}return}
 if(a==='opt'){const q=G.qs[G.n];G.sel=+v;return answer(q.opts[+v]===q.ans)}
 if(a==='pick'){const q=G.qs[G.n];G.sel=+v;render();return say(q.opts[+v])}
 if(a==='build'){G.built.push(+v);return render()}
 if(a==='unbuild'){G.built.splice(+v,1);return render()}
 if(a==='clear'){G.built=[];return render()}
 if(a==='ok'){const q=G.qs[G.n];if(q.t==='W2S')return answer(q.opts[G.sel]===q.ans);const got=G.built.map(k=>q.pool.find(p=>p.k===k).t).join(q.sp?' ':'');return answer(got===q.ans)}
 if(a==='next'){G.n++;G.sel=-1;G.built=[];G.st='ask';if(G.n>=G.qs.length||G.hearts<=0)return finish();render();return setTimeout(autoplay,200)}
 if(a==='slow'){S.slow=b.checked?1:0;save();return}
 if(a==='unl'){S.unlock=b.checked?1:0;save();return}
 if(a==='rename'){const n=prompt('Ton prénom :',S.name);if(n&&n.trim()){S.name=n.trim().slice(0,14);save();render()}return}
 if(a==='reset'){if(confirm('Tout effacer ?')){try{localStorage.removeItem(KEY)}catch(e){}load();V={s:'onb'};render()}return}
});
load();V=S.name?{s:'home'}:{s:'onb'};history.replaceState({V},'');render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
